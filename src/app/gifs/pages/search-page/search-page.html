<h2 class="text-2xl font-bold mt-5 text-white">Buscar Gifs</h2>
<h2 class="text-sm text-gray-500">Buscar Gifs por nombre, descripción o tags</h2>

<section class="flex flex-col gap-4">
  <input 
    type="text"
    placeholder="Buscar gifs"
    class="mt-3 border border-gray-700 bg-gray-800 text-white rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
    (keyup.enter)="onSearch(txtSearch.value)"
    #txtSearch
  >
</section>

<!-- El listado de gifs que él dejó preparado -->
<section class="py-5">
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    @for (gif of gifs; track gif.id) {
      <div class="bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700">
        <img [src]="gif.images.fixed_height.url" [alt]="gif.title" class="w-full h-48 object-cover">
        <p class="text-white text-xs p-2.5 truncate bg-gray-900/50">{{ gif.title || 'Sin título' }}</p>
      </div>
    }
  </div>
</section>
